<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>投稿詳細 - 社内つぶやきボード</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1>投稿詳細</h1>
    <nav>
        <a th:href="@{/posts}">一覧に戻る</a>
    </nav>

    <article class="post">
        <header class="post__header">
            <span class="avatar" th:classappend="'avatar-' + ${post.avatarColor}">
                <span class="avatar__initial" th:text="${#strings.substring(post.author, 0, 1)}">T</span>
            </span>
            <span class="post__author" th:text="${post.author}">投稿者</span>
        </header>
        <p class="post__body" th:text="${post.body}">本文</p>
        <time class="post__created-at"
              th:datetime="${post.createdAt}"
              th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-23 09:00</time>
        <div class="post__like">
            <form th:action="@{/posts/{id}/likes(id=${post.id})}" method="post">
                <button type="submit"
                        class="like-btn"
                        th:classappend="${liked} == true ? ' liked' : ''"
                        th:aria-pressed="${liked} == true">
                    <span th:text="${liked} == true ? '❤️' : '♡'">♡</span>
                    <span>いいね</span>
                    <span th:text="${likeCount}">0</span>
                </button>
            </form>
        </div>
    </article>
</main>
</body>
</html>
